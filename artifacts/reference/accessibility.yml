- text: National Informatics Centre. September 15, 2026 Hi, Sorry about the inconvenience. Try clearing the cache or reinstalling the app. In case the issue still persists, kindly send the error screenshot to helpdesk-mparivahan@gov.in along with the contact details so that we check this. Adit Newah
