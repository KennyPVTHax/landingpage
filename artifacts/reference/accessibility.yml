- text: July 20, 2026 Was better, got worse. I had my vehicle details stored in the app for quite some time now. However when i wanted to check something about my vehicle now i can't find the info anymore. So, i tried adding my vehicle again just to get prompted to enter OTP which just has a validity of 30secs. While I was able to enter the OTP i got Unexpected error message and the OTP session got expired and had to regenerate the OTP and re-enter to get the same result. This happened several times. Annoying. 105 people found this review helpful Did you find this helpful?
