- text: September 16, 2026 Not working, every time I login it says unexpected error or says you are logging in from different device. Doesn't work when you need it the most. tried reinstalling too still doesn't work. cleared cache too. It worked well in the past but now it just doesn't. I wrote that I already reinstalled and tried clearing cache. still same auto reply. 170 people found this review helpful Did you find this helpful?
