- heading "About this app" [level=2]
- button "See more information on About this app"
- text: "Provides Transport Service access to citizens through a mobile-based application. This app empowers citizen with instant access to various information, services and utilities related to the Transport Sector. Aimed to bring convenience to citizen and transparency in the system. It is a genuine government app for all India RTO vehicle registration number search. It provides complete information about any vehicle which is registered in India like - - Owner Name - Registration date - Registering Authority - Make Model - Fuel Type - Vehicle Age - Vehicle class - Insurance Validity - Fitness Validity All this information will be displayed in details. The main benefits of this app are - 1. Find details of any parked, accidental or theft vehicle by just entering the registration number. 2. Verify your car registration details. 3. Verify details of a second-hand vehicle. 4. If you want to buy a second-hand car you can verify the age and registration details. Along with the above features, you can also verify DL details and create virtual DL and RC in this app. Highlights: Virtual RC/DL, Encrypted QR Code, Information Services, DL/RC search, Transport Notification to the citizen, RTO/Traffic Office Locations. Complete Transport Office related services will also be facilitated soon.."
- note "Complete Transport Solution for Citizen"
- text: Updated on Sep 30, 2026
